<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VERACHKI | Network</title>
    <link rel="icon" type="image/x-icon" href="cover.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;800&family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Courier+New&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.73.1/dist/3d-force-graph.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #FFFFFF !important;
            overflow: hidden;
        }
        #graph-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .nav-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        .network-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #111;
        }
        .aurora-bg { display: none; }
    </style>
</head>
<body>
    <div id="graph-container"></div>

    <div class="nav-overlay">
        <a href="index.html" class="btn btn-outline" style="background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);">
            ❮ НАЗАД В МИР
        </a>
    </div>

    <div id="tooltip" class="network-tooltip"></div>

    <script src="network.js"></script>
</body>
</html>
